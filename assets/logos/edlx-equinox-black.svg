<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Black version: all elements #1A1A1A -->

  <defs>
    <!-- Path for EDLX text along top arc -->
    <path id="topArc" d="M 95 500 A 405 405 0 0 1 905 500" fill="none"/>
    <!-- Path for EQUINOX text along bottom arc -->
    <path id="bottomArc" d="M 905 500 A 405 405 0 0 1 95 500" fill="none"/>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500&amp;family=Space+Mono&amp;display=swap');
      .title-text {
        font-family: 'Cinzel', serif;
        font-weight: 500;
        font-size: 48px;
        letter-spacing: 0.1em;
        fill: #1A1A1A;
      }
      .date-text {
        font-family: 'Space Mono', monospace;
        font-size: 16px;
        fill: #1A1A1A;
      }
    </style>
  </defs>

  <!-- Outer circle -->
  <circle cx="500" cy="500" r="450" fill="none" stroke="#1A1A1A" stroke-width="3"/>

  <!-- Inner circle -->
  <circle cx="500" cy="500" r="300" fill="none" stroke="#1A1A1A" stroke-width="3"/>

  <!-- Horizontal line (equator) -->
  <line x1="200" y1="500" x2="800" y2="500" stroke="#1A1A1A" stroke-width="3"/>

  <!-- Center sun circle -->
  <circle cx="500" cy="500" r="25" fill="none" stroke="#1A1A1A" stroke-width="3"/>

  <!-- Left intersection circle (day/night) -->
  <circle cx="200" cy="500" r="15" fill="none" stroke="#1A1A1A" stroke-width="3"/>

  <!-- Right intersection circle (day/night) -->
  <circle cx="800" cy="500" r="15" fill="none" stroke="#1A1A1A" stroke-width="3"/>

  <!-- EDLX text along top arc -->
  <text class="title-text">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">EDLX</textPath>
  </text>

  <!-- EQUINOX text along bottom arc -->
  <text class="title-text">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">EQUINOX</textPath>
  </text>

  <!-- Date at bottom -->
  <text x="500" y="970" text-anchor="middle" class="date-text">21.03.26</text>
</svg>
